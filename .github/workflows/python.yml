name: Python

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff==0.16.1
      - name: Run ruff
        run: ruff check .
      - uses: actions/setup-python@v5
        with:
          # locking this to a version compatible with pyo3+maturin
          python-version: "3.14.6"
      - name: Override Rust Version
        run: rustup override set "$(cat .github/rust-test-version)"
      # TODO: there has to be a cleaner way to do this and also add caching
      - name: "create venv"
        run: python -m venv .venv
      - uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --manifest-path pco_python/Cargo.toml
          sccache: true
      - name: Install test requirements
        run: source .venv/bin/activate && pip install -r pco_python/test_requirements.txt
      - name: Run tests
        run: source .venv/bin/activate && pytest -v --doctest-glob=*.md
